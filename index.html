<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Approval Guru</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg-body: #f3f4f6;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); }

    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.5rem; }
    .hidden { display: none !important; }

    .form-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input { flex: 1; padding: 0.6rem; border: 1px solid var(--border); border-radius: var(--radius); }
    
    button {
      background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem;
      border-radius: var(--radius); cursor: pointer; font-weight: 500;
    }
    .btn-approve { background: #10b981; font-size: 0.8rem; padding: 0.4rem 0.8rem; }
    .btn-approve:hover { background: #059669; }
    .btn-revoke { background: #f59e0b; font-size: 0.8rem; padding: 0.4rem 0.8rem; }
    .btn-revoke:hover { background: #d97706; }
    .btn-secondary { background: #6b7280; }

    /* Table Styles */
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background-color: #f9fafb; font-weight: 600; }
    
    .status-badge {
      padding: 0.2rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: bold;
    }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-approved { background: #d1fae5; color: #065f46; }
  </style>
</head>
<body>

  <header>
    <h1>Dashboard Admin - Management Guru</h1>
    <div id="adminProfile" class="hidden">
      <span id="adminEmail">admin@sekolah.id</span>
      <button id="logoutBtn" class="btn-secondary" style="margin-left: 1rem;">Logout</button>
    </div>
  </header>

  <div class="container">

    <!-- LOGIN FORM FOR ADMIN -->
    <div id="loginCard" class="card">
      <h2>Login Admin</h2>
      <form id="adminLoginForm">
        <div class="form-group">
          <input type="email" id="emailInput" placeholder="Email Admin" required>
          <input type="password" id="passwordInput" placeholder="Password Admin" required>
        </div>
        <button type="submit">Login sebagai Admin</button>
      </form>
    </div>

    <!-- MAIN ADMIN PANEL -->
    <div id="adminPanel" class="card hidden">
      <h2>Daftar Pendaftaran Guru</h2>
      <p style="font-size:0.85rem; color: var(--text-muted);">Setujui (Approve) pendaftaran guru agar mereka dapat membuat tugas dan mengunggah materi.</p>

      <table>
        <thead>
          <tr>
            <th>Nama Lengkap</th>
            <th>Email</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="teacherTableBody">
          <tr><td colspan="4">Memuat data guru...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, query, where, onSnapshot, doc, updateDoc, getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. ISI KONFIGURASI FIREBASE Anda
    const firebaseConfig = {
      apiKey: "AIzaSyBJETCKPOLwFnVp8Q8Zev6tL_MJAsxAAJc",
  authDomain: "kelas6b-bfc03.firebaseapp.com",
  databaseURL: "https://kelas6b-bfc03-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kelas6b-bfc03",
  storageBucket: "kelas6b-bfc03.firebasestorage.app",
  messagingSenderId: "632145539568",
  appId: "1:632145539568:web:136471f4ec654a3097ed35"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginCard = document.getElementById('loginCard');
    const adminPanel = document.getElementById('adminPanel');
    const adminProfile = document.getElementById('adminProfile');
    const teacherTableBody = document.getElementById('teacherTableBody');

    // 2. LOGIN ADMIN
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert("Gagal Login Admin: " + err.message);
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    // 3. AUTH STATE & RBAC CHECK
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Cek Role di Firestore
        const userDoc = await getDoc(doc(db, "users", user.uid));
        
        if (userDoc.exists() && userDoc.data().role === 'admin') {
          // Jika BENAR ADMIN
          loginCard.classList.add('hidden');
          adminPanel.classList.remove('hidden');
          adminProfile.classList.remove('hidden');
          document.getElementById('adminEmail').innerText = user.email;

          loadTeachersRealtime();
        } else {
          // Jika BUKAN ADMIN
          alert("Akses Ditolak! Akun Anda bukan Admin.");
          await signOut(auth);
        }
      } else {
        loginCard.classList.remove('hidden');
        adminPanel.classList.add('hidden');
        adminProfile.classList.add('hidden');
      }
    });

    // 4. MEMUAT DAFTAR GURU DARI FIRESTORE
    function loadTeachersRealtime() {
      const q = query(collection(db, "users"), where("role", "==", "guru"));

      onSnapshot(q, (snapshot) => {
        teacherTableBody.innerHTML = '';

        if (snapshot.empty) {
          teacherTableBody.innerHTML = '<tr><td colspan="4">Belum ada akun guru terdaftar.</td></tr>';
          return;
        }

        snapshot.forEach((teacherDoc) => {
          const teacher = teacherDoc.data();
          const uid = teacherDoc.id;
          const isApproved = teacher.isApproved || false;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${teacher.name || 'Tanpa Nama'}</strong></td>
            <td>${teacher.email}</td>
            <td>
              <span class="status-badge ${isApproved ? 'status-approved' : 'status-pending'}">
                ${isApproved ? 'Aktif / Approved' : 'Menunggu Approval'}
              </span>
            </td>
            <td>
              ${isApproved 
                ? `<button class="btn-revoke" onclick="toggleApproval('${uid}', false)">Batalkan (Revoke)</button>` 
                : `<button class="btn-approve" onclick="toggleApproval('${uid}', true)">Setujui (Approve)</button>`}
            </td>
          `;
          teacherTableBody.appendChild(tr);
        });
      });
    }

    // 5. EKSEKUSI APPROVAL / REVOKE STATUS GURU
    window.toggleApproval = async (uid, status) => {
      try {
        await updateDoc(doc(db, "users", uid), {
          isApproved: status
        });
        alert(`Status guru berhasil diubah menjadi: ${status ? 'Approved' : 'Pending'}`);
      } catch (err) {
        alert("Gagal mengubah status: " + err.message);
      }
    };
  </script>
</body>
</html>
